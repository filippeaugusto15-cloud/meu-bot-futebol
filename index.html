<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Entradas - Futebol Ao Vivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; }
        h1 { text-align: center; margin-bottom: 25px; color: #38bdf8; font-size: 1.8rem; }
        
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; }
        .coluna { flex: 1; min-width: 300px; background-color: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        
        .coluna-titulo { font-size: 1.2rem; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .live-tag { background-color: #ef4444; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .pre-tag { background-color: #3b82f6; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        
        .card { background-color: #0f172a; border-left: 4px solid #10b981; padding: 15px; border-radius: 6px; margin-bottom: 12px; animation: fadeIn 0.4s ease-in-out; }
        .card.pre { border-left-color: #3b82f6; }
        .card-texto { font-size: 1rem; font-weight: 600; color: #f1f5f9; }
        .card-subtexto { font-size: 0.85rem; color: #94a3b8; margin-top: 5px; }
        .lista-sugestoes { list-style: none; margin-top: 8px; }
        .lista-sugestoes li { padding: 4px 0; color: #cbd5e1; font-size: 0.95rem; }
        .lista-sugestoes li::before { content: "• "; color: #3b82f6; font-weight: bold; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>Painel de Alertas de Entradas</h1>

    <div class="container">
        <!-- Coluna de Entradas LIVE -->
        <div class="coluna">
            <div class="coluna-titulo">
                <span>Entradas Ao Vivo</span>
                <span class="live-tag">LIVE</span>
            </div>
            <div id="painel-live">
                <!-- Os alertas ao vivo serão inseridos aqui -->
            </div>
        </div>

        <!-- Coluna de Entradas PRE-LIVE -->
        <div class="coluna">
            <div class="coluna-titulo">
                <span>Análises Pré-Jogo</span>
                <span class="pre-tag">PRÉ-GAME</span>
            </div>
            <div id="painel-pre">
                <!-- As análises pré-jogo serão inseridas aqui -->
            </div>
        </div>
    </div>

    <script>
        // Conexão WebSocket com o servidor Python
        const ws = new WebSocket("ws://" + window.location.host + "/ws");

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);

            if (data.tipo === "LIVE") {
                adicionarAlertaLive(data.texto);
            } else if (data.tipo === "PRE_LIVE") {
                adicionarAlertaPre(data.jogo, data.entradas);
            }
        };

        function adicionarAlertaLive(texto) {
            const painel = document.getElementById("painel-live");
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <div class="card-texto">${texto}</div>
                <div class="card-subtexto">Gerado em tempo real</div>
            `;
            // Insere no topo
            painel.insertBefore(card, painel.firstChild);
        }

        function adicionarAlertaPre(jogo, entradas) {
            const painel = document.getElementById("painel-pre");
            
            // Evita duplicar se já existir o mesmo jogo na tela
            painel.innerHTML = ""; 

            const card = document.createElement("div");
            card.className = "card pre";
            
            let itensLista = "";
            entradas.forEach(item => {
                itensLista += `<li>${item}</li>`;
            });

            card.innerHTML = `
                <div class="card-texto">${jogo}</div>
                <ul class="lista-sugestoes">
                    ${itensLista}
                </ul>
            `;
            painel.appendChild(card);
        }
    </script>
</body>
</html>
